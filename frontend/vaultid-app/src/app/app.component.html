<header class="topbar">
  <div class="brand"><i class="ph ph-shield-check"></i>VaultID</div>
  @if (auth.user()) {
    <div class="session">
      <span class="text-muted">{{ auth.username }}</span>
      <button class="btn btn-secondary" (click)="logout()"><i class="ph ph-sign-out"></i>Log out</button>
    </div>
  }
</header>

<div class="app-shell">
  @if (auth.user()) {
    <nav class="sidebar">
      @if (!isOrganisation) {
        <a routerLink="/vault" routerLinkActive="active"><i class="ph ph-vault"></i>My Vault</a>
        <a routerLink="/share" routerLinkActive="active"><i class="ph ph-share-network"></i>Sharing</a>
      }
      @if (isOrganisation) {
        <a routerLink="/organisation" routerLinkActive="active"><i class="ph ph-building-office"></i>Organisation</a>
        <a routerLink="/organisation-admin" routerLinkActive="active"><i class="ph ph-gear"></i>Organisation settings</a>
      }
      <a routerLink="/activity" routerLinkActive="active"><i class="ph ph-clock-counter-clockwise"></i>Activity</a>
    </nav>
  }

  <main class="content">
    <router-outlet />
  </main>
</div>
